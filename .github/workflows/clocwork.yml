# A monthly job that counts the repositories in projects.toml, draws the cards
# README.md embeds, and commits them. Nothing in this repository affects the
# counts, so there is no push trigger. Copied from clocwork's
# examples/clocwork.yml.
#
# Two settings decide whether a first run works, and neither is in this file.
# Workflow permissions, under Settings -> Actions -> General, has to say "Read
# and write permissions" or the push fails with a 403. And a new schedule does
# not fire until it next comes due, so start this one by hand with
# `gh workflow run clocwork.yml`.

name: Line counts

on:
  schedule:
    # The 1st, matching date = "month" in projects.toml. Running weekly would
    # find nothing to commit three weeks in four.
    - cron: '17 5 1 * *'
  workflow_dispatch:

concurrency:
  group: clocwork
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  count:
    name: Count and commit the cards
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Inside the workspace, the only place actions/cache can see. The key
      # follows the project list, so adding a repository starts a new cache.
      - name: Restore the clone cache
        uses: actions/cache@v4
        with:
          path: .clocwork-cache
          key: clocwork-${{ hashFiles('projects.toml') }}
          restore-keys: clocwork-

      # clocwork clones what it counts, so none of it is checked out here.
      # layout and by multiply, so one call writes four files. Only the ones
      # README.md embeds are committed, so out is gitignored and the step
      # after this one copies from it.
      #
      # TODO: switch to @v0 once a clocwork release carrying action.yml exists.
      - name: Count
        uses: wojciechpolak/clocwork@main
        with:
          config: projects.toml
          cache: .clocwork-cache
          out: .clocwork-out
          format: svg
          layout: bars,strip
          by: all

      - name: Keep the two the README embeds
        run: |
          set -euo pipefail
          mkdir -p assets
          cp .clocwork-out/cw-bars-languages.svg assets/
          cp .clocwork-out/cw-strip-projects.svg assets/

      # `date = "month"` under [cli] in projects.toml coarsens the generated-at
      # stamp, so this commits when a count changed or the month rolled over.
      # `none` drops the stamp and makes it the counts alone.
      - name: Commit whatever changed
        run: |
          set -euo pipefail
          # 41898282 is the account id of github-actions[bot], which is what
          # links the commit to that account.
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/cw-*.svg
          git diff --cached --quiet && exit 0
          git commit -m 'Update line counts'
          git push
