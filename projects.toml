# What the cards in README.md count.
#
# Every entry is a clone URL, so nothing has to be checked out: clocwork clones
# each one shallowly into .clocwork-cache and fetches the one commit that moved
# on every run after. See .github/workflows/clocwork.yml.
#
# `name` is what the cards show and `url` makes it a link in the Markdown
# report. Neither is derived from the clone URL, so a project can be called
# whatever it is called.

[defaults]
# Lock files are git-tracked, so they count by default and dominate the totals.
# package-lock.json alone runs to tens of thousands of "JSON" lines.
exclude_langs = ["JSON"]

[cli]
# Drop the generated-at stamp, which is otherwise the only thing a rerun over
# unchanged code changes by itself. The cards then depend on the counts alone,
# so the weekly job commits when the code moved and stays quiet when it did
# not. It sits here rather than in the workflow because both steps read this
# file, and because a scheduled run sets this once and forgets it.
date = "month"

